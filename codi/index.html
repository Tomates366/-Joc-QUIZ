
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main class="contenedor">

        <!-- CABECERA -->
        <header class="cabecera">
            <button id="btnConfiguracion" type="button" aria-label="Configuración">
                ⚙
            </button>

            <div class="titulo-juego">
                <h1>QUIZ MASTER</h1>
                <p>Responde, consigue puntos y mejora</p>
            </div>

            <div class="marcador">
                🪙 <span id="puntos">125,50</span> puntos
            </div>
        </header>

        <!-- MENÚ PRINCIPAL -->
        <section id="menu">
            <button class="btn-jugar"
                    onclick="mostrarPantalla('juego')">
                <strong>JUGAR</strong>
                <span>Responde preguntas y consigue puntos</span>
            </button>

            <div class="tarjeta-progreso">
                <h2>Progreso actual</h2>
                <p>7 de 10 preguntas correctas</p>
                <div class="barra-progreso">
                    <div class="barra-completada"></div>
                </div>
            </div>
        </section>

        <!-- PANTALLA DE PREGUNTAS -->
        <section id="juego" class="oculto">
            <div class="tarjeta-pregunta">

                <p id="progreso">Pregunta 1 de 10</p>

                <h2 id="textoPregunta">
                    ¿Cuál es la capital de Francia?
                </h2>

                <div id="respuestas">
                    <!-- JavaScript creará los botones -->
                </div>

                <p id="mensaje" aria-live="polite"></p>

                <button id="btnSiguiente"
                        class="btn-siguiente oculto"
                        onclick="siguientePregunta()">
                    SIGUIENTE PREGUNTA
                </button>
            </div>
        </section>

        <!-- PANTALLA DE LOGROS -->
        <section id="logros" class="oculto">
            <h2>LOGROS</h2>
            <p>Completa retos para conseguir mejoras permanentes</p>

            <div id="listaLogros">
                <!-- Aquí se añadirán las tarjetas de logros -->
            </div>
        </section>

        <!-- PANTALLA DE TIENDA -->
        <section id="tienda" class="oculto">
            <h2>TIENDA</h2>
            <p>Gasta tus puntos en mejoras temporales</p>

            <div id="listaTienda">
                <!-- Aquí se añadirán las tarjetas de la tienda -->
            </div>
        </section>

        <!-- RESULTADOS -->
        <section id="resultados" class="oculto">
            <h2>Resultados finales</h2>

            <p id="puntuacion"></p>

            <button onclick="iniciarJuego()">
                Volver a jugar
            </button>

            <button onclick="mostrarPantalla('menu')">
                Menú principal
            </button>
        </section>

        <!-- MENÚ INFERIOR -->
        <nav class="menu-inferior" aria-label="Navegación principal">
            <button id="navPreguntas"
                    onclick="mostrarPantalla('juego')">
                ❓ PREGUNTAS
            </button>

            <button id="navLogros"
                    onclick="mostrarPantalla('logros')">
                🏆 LOGROS
            </button>

            <button id="navTienda"
                    onclick="mostrarPantalla('tienda')">
                🛒 TIENDA
            </button>
        </nav>

    </main>
</body>
</html>
